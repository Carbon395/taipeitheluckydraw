<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺北市政府觀光傳播局・旅遊臺北好宿的好運籤</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --temple-red: #A8201A;   
            --gold: #EC9A29;         
            --wood-dark: #3a1e02;     
            --light-bg: #FAF7F2;      
            --dark-text: #2C2C2C;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--dark-text);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(#e5dcce 1px, transparent 1px);
            background-size: 28px 28px;
        }

        header {
            width: 100%;
            padding: 20px 30px;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: 800;
            color: var(--temple-red);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: nowrap;
            white-space: nowrap;
        }

        .logo span {
            background-color: var(--gold);
            color: var(--wood-dark);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 1.05rem;
            font-weight: bold;
        }

        .bureau-tag {
            font-size: 0.95rem;
            color: #666;
            font-weight: 600;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .main-container {
            max-width: 680px;
            width: 100%;
            padding: 25px 20px 40px 20px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero-title {
            color: var(--temple-red);
            font-size: 2.3rem;
            margin-bottom: 12px;
            letter-spacing: 2px;
            font-weight: 900;
        }

        .hero-subtitle {
            color: #555;
            font-size: 1.2rem;
            margin-bottom: 25px;
            line-height: 1.7;
            font-weight: 500;
        }

        .fortune-zone {
            position: relative;
            margin-top: 55px;
            margin-bottom: 45px;
            height: 310px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            width: 100%;
            perspective: 1200px;
        }

        /* 立體籤筒主體 */
        .stick-container {
            width: 165px;
            height: 225px;
            background: linear-gradient(90deg, #421d02 0%, #7d3c10 25%, #bf6923 50%, #824011 75%, #381801 100%);
            border: 4px solid #542503;
            border-radius: 14px 14px 32px 32px;
            position: relative;
            box-shadow: inset 0 15px 25px rgba(255,255,255,0.22), inset 0 -25px 35px rgba(0,0,0,0.85), 0 20px 40px rgba(0,0,0,0.35);
            transform-origin: bottom center;
            z-index: 2;
        }

        .stick-container::before {
            content: "";
            position: absolute;
            top: 25px;
            left: -5px;
            right: -5px;
            height: 14px;
            background: linear-gradient(90deg, #b8860b, #ffe552, #daa520, #b8860b);
            border-top: 1px solid #fff;
            border-bottom: 2px solid #5a3800;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }

        .stick-container::after {
            content: "籤";
            position: absolute;
            top: 54%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 72px;
            height: 72px;
            background: radial-gradient(circle at 35% 35%, #e53935, #680000);
            color: #ffeb3b;
            border-radius: 50%;
            font-size: 2.1rem;
            font-weight: 900;
            line-height: 72px;
            text-align: center;
            border: 3px solid #ffeb3b;
            box-shadow: inset 2px 2px 6px rgba(255,255,255,0.5), 0 6px 14px rgba(0,0,0,0.45);
            letter-spacing: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 籤筒內竹籤束 */
        .fortune-sticks-bundle {
            position: absolute;
            top: -65px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 170px;
            z-index: 1;
            pointer-events: none;
            transform-origin: bottom center;
        }

        .mini-stick {
            width: 10px;
            height: 165px;
            background: linear-gradient(90deg, #b87c3e, #fcead0 40%, #d89952 75%, #8f5623);
            border: 1px solid #734117;
            position: absolute;
            bottom: 0;
            border-radius: 5px 5px 0 0;
            transform-origin: bottom center;
            box-shadow: 2px -2px 6px rgba(0,0,0,0.3);
        }

        .mini-stick::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(90deg, #d32f2f, #f44336, #b71c1c);
            border-radius: 5px 5px 0 0;
            border-bottom: 1px solid rgba(0,0,0,0.3);
        }

        .mini-stick::after {
            content: "";
            position: absolute;
            top: 45px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: rgba(90, 45, 10, 0.4);
            box-shadow: 0 35px 0 rgba(90, 45, 10, 0.4), 0 70px 0 rgba(90, 45, 10, 0.4);
        }

        .mini-stick:nth-child(1)  { left: 2px;   transform: rotate(-28deg); height: 152px; }
        .mini-stick:nth-child(2)  { left: 13px;  transform: rotate(-20deg); height: 162px; }
        .mini-stick:nth-child(3)  { left: 24px;  transform: rotate(-12deg); height: 168px; }
        .mini-stick:nth-child(4)  { left: 36px;  transform: rotate(-4deg);  height: 160px; }
        .mini-stick:nth-child(5)  { left: 48px;  transform: rotate(3deg);   height: 166px; }
        .mini-stick:nth-child(6)  { left: 60px;  transform: rotate(11deg);  height: 158px; }
        .mini-stick:nth-child(7)  { left: 72px;  transform: rotate(19deg);  height: 164px; }
        .mini-stick:nth-child(8)  { left: 84px;  transform: rotate(26deg);  height: 155px; }
        .mini-stick:nth-child(9)  { left: 95px;  transform: rotate(32deg);  height: 148px; }

        /* 抽出的指定籤支 */
        .fortune-stick {
            width: 13px;
            height: 195px;
            background: linear-gradient(90deg, #c78947, #fffaee 40%, #e0a762 75%, #965b26);
            border: 1.5px solid #734117;
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 6px 6px 0 0;
            z-index: 3;
            opacity: 0;
            box-shadow: 4px 4px 12px rgba(0,0,0,0.35);
        }

        .fortune-stick::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 14px;
            background: linear-gradient(90deg, #e53935, #ff5252, #c62828);
            border-radius: 5px 5px 0 0;
        }

        .fortune-stick::after {
            content: "";
            position: absolute;
            top: 50px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: rgba(90, 45, 10, 0.4);
            box-shadow: 0 45px 0 rgba(90, 45, 10, 0.4), 0 90px 0 rgba(90, 45, 10, 0.4);
        }

        /* 搖籤筒與竹籤束動畫 */
        .shake-animation {
            animation: shakeTong 0.28s infinite ease-in-out;
        }

        .shake-bundle {
            animation: shakeBundle 0.28s infinite ease-in-out;
        }

        @keyframes shakeTong {
            0%   { transform: rotate(0deg) translateY(0); }
            20%  { transform: rotate(10deg) translateY(-6px); }
            40%  { transform: rotate(-11deg) translateY(3px); }
            60%  { transform: rotate(8deg) translateY(-4px); }
            80%  { transform: rotate(-9deg) translateY(4px); }
            100% { transform: rotate(0deg) translateY(0); }
        }

        @keyframes shakeBundle {
            0%   { transform: translateX(-50%) rotate(0deg) translateY(0); }
            20%  { transform: translateX(-50%) rotate(7deg) translateY(-12px); }
            40%  { transform: translateX(-50%) rotate(-8deg) translateY(-4px); }
            60%  { transform: translateX(-50%) rotate(6deg) translateY(-10px); }
            80%  { transform: translateX(-50%) rotate(-7deg) translateY(-5px); }
            100% { transform: translateX(-50%) rotate(0deg) translateY(0); }
        }

        .draw-action {
            animation: pullOutStick 1.1s forwards cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes pullOutStick {
            0%   { top: 25px; transform: translateX(-50%) rotate(0deg) scale(1); opacity: 0.4; }
            40%  { top: -45px; transform: translateX(-50%) rotate(-8deg) scale(1.05); opacity: 0.8; }
            70%  { top: -95px; transform: translateX(-50%) rotate(12deg) scale(1.15); opacity: 1; }
            100% { top: -125px; transform: translateX(-50%) rotate(18deg) scale(1.2); opacity: 1; box-shadow: 4px 14px 25px rgba(168,32,26,0.6); }
        }

        .btn {
            background-color: var(--temple-red);
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(168, 32, 26, 0.35);
            transition: all 0.3s ease;
            letter-spacing: 2px;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(168, 32, 26, 0.45);
            background-color: #bd2a23;
        }

        .btn:disabled {
            background-color: #ccc;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.65);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .result-card {
            background: #fff;
            background-image: radial-gradient(#f4f1ea 1px, transparent 0);
            background-size: 22px 22px;
            width: 100%;
            max-width: 640px;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.25);
            text-align: center;
            border: 6px double var(--temple-red);
            animation: scaleUp 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 92vh;
            overflow-y: auto;
        }

        @keyframes scaleUp {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .poe-zone {
            margin: 25px 0;
            display: flex;
            justify-content: center;
            gap: 55px;
            perspective: 1200px;
            height: 140px;      
            align-items: center;
        }

        .poe {
            width: 110px;
            height: 52px;
            background: radial-gradient(circle at 40% 35%, #e53935, #550000);
            border-radius: 0 0 52px 52px; 
            box-shadow: inset 3px 3px 8px rgba(255,255,255,0.35), inset -4px -4px 12px rgba(0,0,0,0.85), 0 8px 18px rgba(0,0,0,0.35);
            transform-style: preserve-3d;
            transform-origin: center center;
            position: relative;
        }

        #poe1 { transform: rotate(-10deg); }
        #poe2 { transform: rotate(10deg); }

        .poe-spin-1 { animation: crescentSpin1 1.6s cubic-bezier(0.15, 0.8, 0.25, 1.05) forwards; }
        .poe-spin-2 { animation: crescentSpin2 1.6s cubic-bezier(0.15, 0.8, 0.25, 1.05) forwards; }

        @keyframes crescentSpin1 {
            0% { transform: translateY(0) rotateX(0deg) rotateY(0deg) rotateZ(-10deg) scale(1); }
            20% { transform: translateY(-95px) translateX(-18px) rotateX(720deg) rotateY(540deg) rotateZ(350deg) scale(1.18); }
            50% { transform: translateY(-45px) translateX(12px) rotateX(1440deg) rotateY(1080deg) rotateZ(710deg) scale(1.08); }
            85% { transform: translateY(12px) translateX(-4px) rotateX(2160deg) rotateY(1620deg) rotateZ(1070deg) scale(0.98); }
            100% { transform: translateY(0) translateX(0) rotateX(2520deg) rotateY(1800deg) rotateZ(1250deg) scale(1); }
        }

        @keyframes crescentSpin2 {
            0% { transform: translateY(0) rotateX(0deg) rotateY(0deg) rotateZ(10deg) scale(1); }
            20% { transform: translateY(-95px) translateX(18px) rotateX(-720deg) rotateY(-540deg) rotateZ(-350deg) scale(1.18); }
            50% { transform: translateY(-45px) translateX(-12px) rotateX(-1440deg) rotateY(-1080deg) rotateZ(-710deg) scale(1.08); }
            85% { transform: translateY(12px) translateX(4px) rotateX(-2160deg) rotateY(-1620deg) rotateZ(-1070deg) scale(0.98); }
            100% { transform: translateY(0) translateX(0) rotateX(-2520deg) rotateY(-1800deg) rotateZ(-1250deg) scale(1); }
        }

        .poe.sheng-flat {
            background: radial-gradient(circle at 50% 45%, #ef5350, #7a0000);
            box-shadow: inset 0 0 16px rgba(255,255,255,0.45), 0 4px 10px rgba(0,0,0,0.3);
            border-radius: 0 0 52px 52px;
        }
        .poe.sheng-convex {
            background: radial-gradient(circle at 30% 30%, #c62828, #300000);
            box-shadow: inset 5px 5px 12px rgba(255,255,255,0.25), inset -5px -5px 14px rgba(0,0,0,0.9), 0 3px 6px rgba(0,0,0,0.4);
            border-radius: 52px 52px 0 0;
        }

        .fortune-number {
            font-size: 1.5rem;
            color: var(--gold);
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .fortune-title {
            font-size: 2.2rem;
            color: var(--temple-red);
            font-weight: 900;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .fortune-poem {
            font-size: 1.55rem;
            font-weight: 800;
            color: #1a1a1a;
            border-top: 3px dashed var(--gold);
            border-bottom: 3px dashed var(--gold);
            padding: 20px 0;
            margin: 22px 0;
            letter-spacing: 2px;
            line-height: 1.4;
            white-space: nowrap;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        .info-section {
            text-align: left;
            margin-top: 24px;
            background-color: #fcfbf7;
            padding: 24px;
            border-radius: 12px;
            border-left: 6px solid var(--gold);
        }

        .info-title {
            font-weight: bold;
            color: #935800;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
        }

        .info-text {
            font-size: 1.2rem;
            line-height: 1.7;
            color: #222;
            margin-bottom: 0;
            font-weight: 600;
        }

        .close-btn {
            background-color: #555;
            margin-top: 22px;
            width: 100%;
        }
        .close-btn:hover {
            background-color: #222;
        }

        footer {
            margin-top: auto;
            padding: 25px;
            font-size: 1rem;
            color: #666;
            text-align: center;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            臺北好宿靈籤 <span>心誠則靈</span>
        </div>
        <div class="bureau-tag">臺北市政府觀光傳播局</div>
    </header>

    <div class="main-container">
        <h1 class="hero-title">尋找您的臺北好宿靈籤</h1>
        <p class="hero-subtitle">誠心默念您對臺北旅行與好宿的期待，搖動籤筒抽籤，<br>隨後將進行擲筊，領取專屬好宿祝福！</p>

        <div class="fortune-zone">
            <div class="fortune-sticks-bundle" id="sticksBundle">
                <div class="mini-stick"></div>
                <div class="mini-stick"></div>
                <div class="mini-stick"></div>
                <div class="mini-stick"></div>
                <div class="mini-stick"></div>
                <div class="mini-stick"></div>
                <div class="mini-stick"></div>
                <div class="mini-stick"></div>
                <div class="mini-stick"></div>
            </div>
            <div class="fortune-stick" id="fortuneStick"></div>
            <div class="stick-container" id="stickContainer"></div>
        </div>

        <button class="btn" id="drawBtn" onclick="startLottery()">誠心搖筒抽好宿籤</button>
    </div>

    <!-- 彈出視窗 1：擲筊請示 -->
    <div class="modal" id="poeModal">
        <div class="result-card">
            <h2 style="color: var(--temple-red); margin-bottom: 10px; font-size: 1.8rem; font-weight: 800;">向神明稟報與擲筊</h2>
            <p style="font-size: 1.15rem; color:#444; font-weight: 500;">竹籤已抽出！請點擊按鈕擲筊，請示神明是否賜予此好宿籤？</p>
            
            <div class="poe-zone">
                <div class="poe" id="poe1"></div>
                <div class="poe" id="poe2"></div>
            </div>
            
            <p id="poeResultText" style="font-weight:bold; color:var(--gold); margin: 10px 0; min-height: 28px; font-size: 1.25rem;"></p>
            <button class="btn" id="poeBtn" onclick="throwPoe()" style="width: 100%;">擲筊請示神明</button>
        </div>
    </div>

    <!-- 彈出視窗 2：求籤結果 -->
    <div class="modal" id="resultModal">
        <div class="result-card">
            <div class="fortune-number" id="resNumber">第 一 首</div>
            <div class="fortune-title" id="resTitle">大吉・質感旅店</div>
            <div class="fortune-poem" id="resPoem">雲開見日百福至 漫遊臺北萬事新</div>
            
            <div class="info-section">
                <div class="info-title"><i class="fa-solid fa-hotel"></i> 臺北好宿專屬聖示</div>
                <div class="info-text" id="resFortune">載入中...</div>
            </div>

            <button class="btn close-btn" onclick="resetAll()">再次抽好宿籤</button>
        </div>
    </div>

    <footer>
        © 2026 臺北市政府觀光傳播局・臺北好宿祈福體驗
    </footer>

    <script>
        const fortuneDatabase = [
            { id: "第 一 首", title: "大吉・質感旅店", poem: "雲開見日百福至 漫遊臺北萬事新", fortune: "恭喜抽中金獎質感好宿！代表您的臺北行旅將舒適無比、處處驚喜，無論設計旅店或精品旅店皆能讓您一夜好眠、賓至如歸。" },
            { id: "第 二 首", title: "上吉・溫馨旅宿", poem: "春風得意行旅順 滿城燈火笑聲甜", fortune: "您的臺北住宿運正處於最溫馨的高峰，在巷弄間的人情味旅宿中感受滿滿祝福，夜宿安穩且充滿歡笑。" },
            { id: "第 三 首", title: "中吉・商務旅館", poem: "靜心慢行安穩路 隨遇而安福自來", fortune: "最適合差旅與深度漫步的旅館好宿，房間隔音極佳、環境沈穩，讓您在忙碌行程後獲得最極致的身心放鬆。" },
            { id: "第 四 首", title: "小吉・文創旅宿", poem: "微風細雨潤無聲 古道尋幽意自清", fortune: "象徵結合在地文化與美學的文創青年旅館或特色旅店，在充滿設計感的空間中品味臺北獨有的文藝氣息。" },
            { id: "第 五 首", title: "吉・都會樂活", poem: "福至心靈萬事安 一路平安笑開顏", fortune: "平順舒適即是好宿最大價值，祝福您在臺北的精選旅館裡住得安穩、睡得香甜，好運一路相隨。" },
            { id: "第 六 首", title: "大吉・高空景觀宿", poem: "登高望遠天地寬 璀璨夜景喜洋洋", fortune: "入住能眺望101或市景的高樓層景觀旅館，窗外繁華夜色盡收眼底，無限好宿福氣隨之而來。" },
            { id: "第 七 首", title: "上吉・美食聚落宿", poem: "百味飄香人鼎沸 口福不諧樂陶陶", fortune: "鄰近熱鬧夜市或知名美食商圈的優質旅宿，讓您白天盡情探索、夜晚大啖美食後秒回舒服房間休息。" },

            { id: "第 九 首", title: "小吉・巷弄特色宿", poem: "巷弄尋寶多驚喜 咖啡香中度好時", fortune: "隱身於文青街區的老宅改建文旅，推開窗即是迷人咖啡香與獨立小店，體驗最道地的臺北慢活日常。" },

            { id: "第 十二 首", title: "上吉・時尚潮流宿", poem: "燈火輝煌夜未央 歡樂時光無限長", fortune: "座落東區或信義區的潮流設計旅店，夜晚時尚繁華氛圍濃厚，讓喜愛夜生活的旅客擁有最棒的休憩據點。" },
            { id: "第 十三 首", title: "大吉・溫泉療癒宿", poem: "泉水溫潤洗疲憊 身心舒暢得清涼", fortune: "適合前往北投享受白磺或青磺名湯的溫泉旅宿，洗去一身疲憊，享受泉水滋潤與極致放鬆的療癒假期。" },
            { id: "第 十四 首", title: "上吉・藝文漫步宿", poem: "書香門第雅趣多 靜好歲月樂無邊", fortune: "鄰近大安森林公園或藝文特區的靜謐旅宿，晨起伴隨綠意與書香，享受兼具文化與休閒的高質感住宿。" },

            { id: "第 十六 首", title: "小吉・復古懷舊宿", poem: "古色古香情意長 歲月沈香思故人", fortune: "充滿大稻埕古風或歷史風華的特色旅宿，在紅磚洋樓與懷舊懷舊氛圍中，細細品味臺北百年風華的迷人故事。" },

            { id: "第 二十 首", title: "大吉・至尊圓滿宿", poem: "吉星高照福氣多 臺北好宿最稱心", fortune: "抽中籤王至尊好宿！象徵您的臺北之旅心想事成、圓滿順遂，處處遇貴人、好宿相隨一整年！" },
            { id: "第 二十一 首", title: "大吉・觀景溫泉宿", poem: "山水相逢春意鬧 雲深處處笑聲歡", fortune: "適合前往北投或陽明山一帶的景觀溫泉旅宿，享受雲霧繚繞的療癒美景，讓身心靈獲得最徹底的放鬆與充電。" },
            { id: "第 二十二 首", title: "上吉・大稻埕老宅宿", poem: "紅磚洋樓思往事 咖啡香裡好時光", fortune: "隱身於大稻埕的古風文旅，細細品味百年風華，感受兼具歷史與現代感的迷人住宿體驗。" }

        let selectedFortune = null;

        function startLottery() {
            const drawBtn = document.getElementById('drawBtn');
            const stickContainer = document.getElementById('stickContainer');
            const sticksBundle = document.getElementById('sticksBundle');
            const fortuneStick = document.getElementById('fortuneStick');

            drawBtn.disabled = true;
            
            const randomIndex = Math.floor(Math.random() * fortuneDatabase.length);
            selectedFortune = fortuneDatabase[randomIndex];

            stickContainer.classList.add('shake-animation');
            sticksBundle.classList.add('shake-bundle');
            fortuneStick.classList.remove('draw-action');
            fortuneStick.style.opacity = '0';

            if (navigator.vibrate) {
                navigator.vibrate([120, 40, 120, 40, 180, 50, 220]);
            }

            setTimeout(() => {
                stickContainer.classList.remove('shake-animation');
                sticksBundle.classList.remove('shake-bundle');
                
                fortuneStick.classList.add('draw-action');

                setTimeout(() => {
                    openModal('poeModal');
                    const poe1 = document.getElementById('poe1');
                    const poe2 = document.getElementById('poe2');
                    poe1.className = 'poe';
                    poe2.className = 'poe';
                    poe1.style.transform = 'rotate(-10deg)';
                    poe2.style.transform = 'rotate(10deg)';
                    document.getElementById('poeResultText').innerText = "";
                    document.getElementById('poeBtn').disabled = false;
                    document.getElementById('poeBtn').innerText = "擲筊請示神明";
                }, 1050);

            }, 1250);
        }

        function throwPoe() {
            const poe1 = document.getElementById('poe1');
            const poe2 = document.getElementById('poe2');
            const poeBtn = document.getElementById('poeBtn');
            const poeResultText = document.getElementById('poeResultText');

            poeBtn.disabled = true;
            poeResultText.innerText = "筊杯旋轉翻滾中...";
            
            poe1.classList.add('poe-spin-1');
            poe2.classList.add('poe-spin-2');

            if (navigator.vibrate) {
                navigator.vibrate([150, 50, 150, 50, 150]);
            }

            const shengMessages = [
                "【 聖筊 】 神明允杯：此好宿極佳，旅途平安圓滿！",
                "【 聖筊 】 神明賜杯：心境放輕鬆，享受美好臺北宿！",
                "【 聖筊 】 神明大讚：福氣滿點，此乃上上大吉之兆！"
            ];
            const randomMsg = shengMessages[Math.floor(Math.random() * shengMessages.length)];

            setTimeout(() => {
                poe1.classList.add('sheng-flat');
                poe2.classList.add('sheng-convex');
                poeResultText.innerText = randomMsg;

                setTimeout(() => {
                    closeModal('poeModal');
                    showResult();
                }, 2000);

            }, 1600);
        }

        function showResult() {
            if (!selectedFortune) return;

            document.getElementById('resNumber').innerText = selectedFortune.id;
            document.getElementById('resTitle').innerText = selectedFortune.title;
            document.getElementById('resPoem').innerText = selectedFortune.poem;
            document.getElementById('resFortune').innerText = selectedFortune.fortune;

            openModal('resultModal');
        }

        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function resetAll() {
            closeModal('poeModal');
            closeModal('resultModal');
            document.getElementById('drawBtn').disabled = false;
            
            const fortuneStick = document.getElementById('fortuneStick');
            fortuneStick.classList.remove('draw-action');
            fortuneStick.style.opacity = '0';
            
            const poe1 = document.getElementById('poe1');
            const poe2 = document.getElementById('poe2');
            poe1.className = 'poe';
            poe2.className = 'poe';
            poe1.style.transform = 'rotate(-10deg)';
            poe2.style.transform = 'rotate(10deg)';
        }
    </script>
